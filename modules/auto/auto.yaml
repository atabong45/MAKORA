  api_json_fr:
    sinistre_id: ID_Sinistre
    assure_id: ID_Assure
    anciennete_jours: Anciennete_Contrat
    montant_devis: Montant_Devis
    code_reparation: Code_Reparation
    garage_id: ID_Garage
    agree_cima: Agrement_CIMA
    constat_present: Constat_Amiable_Present
    expertise_signee: Rapport_Expertise_Signe
    sinistre_nuit: Flag_Sinistre_Nuit
    nb_temoins: Nb_Temoins
    devise: Devise
    delai_declaration: Delai_Declaration
    heure_saisie: Heure_Saisie
    date_sinistre: Date_Sinistre

# ====================================================================
# SECTION 6 — Mercuriale Auto
# ====================================================================
mercuriale:
  enabled: true
  path: "data/referentials/bareme_asac_auto.yaml"
  currency: "XAF"
  tolerance_pct: 10
  code_column: "Code_Reparation"
  price_column: "Prix_Ref_XAF"
  fallback_column: "Montant_Reference_Bareme"
  strict: false

# ====================================================================
# SECTION 7 — Graph analysis (T13.1)
# [Blondel2008] Louvain — fraude coordonnée garage↔assuré
# score_output_col harmonisé avec SanteModule pour M_makora_dif.
# ====================================================================
graph_analysis:
  enabled: true
  entity_col: "ID_Garage"
  assure_col: "ID_Assure"
  weight_col: "Montant_Devis"
  min_community_size: 2
  suspicious_density_threshold: 0.4
  score_output_col: "community_score" # ★ COMMUN avec SanteModule (v1.2.0)

# ====================================================================
# SECTION 8 — Drift monitoring
# [Gama2014] : PSI > 0.2 → réentraînement recommandé
# Tous les noms reflètent la nomenclature v1.2.0.
# ====================================================================
drift:
  monitored_features:
    - ratio_devis_bareme # feature #1 fraude auto
    - vehicule_sur_value # sur-valorisation — drift marché auto
    - prestataire_concentration # concentration garage — drift réseau
    - nb_sinistres_recents # fréquence — drift comportemental
    - montant_log # distribution montants — drift inflation
    - community_score # signal réseau — drift composition fraude
  reference_window_days: 90
  current_window_days: 30
  thresholds:
    warning: 0.10
    critical: 0.20
