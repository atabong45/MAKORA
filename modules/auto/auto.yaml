    Anciennete_Contrat: Anciennete_Contrat
    Montant_Devis: Montant_Devis
    Code_Reparation: Code_Reparation
    ID_Garage: ID_Garage
    Agrement_CIMA: Agrement_CIMA
    Constat_Amiable_Present: Constat_Amiable_Present
    Rapport_Expertise_Signe: Rapport_Expertise_Signe
    Flag_Sinistre_Nuit: Flag_Sinistre_Nuit
    Nb_Temoins: Nb_Temoins
    Flag_Doc_Altere: Flag_Doc_Altere
    Valeur_Venale_EUR: Valeur_Venale_EUR
    Montant_Reference_Bareme: Montant_Reference_Bareme
    Ratio_MO: Ratio_MO
    Devise: Devise
    Delai_Declaration: Delai_Declaration
    Heure_Saisie: Heure_Saisie
    Nb_Sinistres_12m: Nb_Sinistres_12m
    Confiance_OCR_Glob: Confiance_OCR_Glob
