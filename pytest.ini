[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: tests unitaires
    contract: tests du Plugin Contract
    integration: tests d\'intégration
    slow: tests lents (>1s)
    api: tests API Phase 3
    e2e: tests end-to-end