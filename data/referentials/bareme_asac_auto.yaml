# data/referentials/bareme_asac_auto.yaml
# Barème ASAC Auto — Réparations automobiles (Cameroun + France)
# Devise : XAF (Franc CFA BEAC)
# Source : Barème indicatif ASAC Auto (simulé pour prototype)
#          + conversion depuis barème Argus France (EUR → XAF via BEAC)
# Mise à jour : Mai 2026
#
# NOTE : Dans le module Auto, le "code acte" devient le "code réparation".
# La colonne source dans le YAML du module sera :
#   code_column: "Code_Reparation"
#   price_column: "Prix_Ref_XAF"
#
# Ce fichier est utilisé pour calculer :
#   ratio_devis_bareme = Montant_Devis / Prix_Ref_XAF
# [Subudhi2017] : l'inflation de devis est le signal de fraude auto #1.

